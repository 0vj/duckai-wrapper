[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duckai-wrapper"
version = "1.0.0"
description = "Production-ready, OpenAI-compatible API wrapper for Duck.ai"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "playwright>=1.48.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/0vj/duckai-wrapper"
Repository = "https://github.com/0vj/duckai-wrapper"
Issues = "https://github.com/0vj/duckai-wrapper/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
